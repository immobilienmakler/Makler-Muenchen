name: Validate static GitHub Pages content

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check SEO and AI resource consistency
        run: python3 scripts/validate_site.py
      - name: Check published Pages files match source
        run: python3 scripts/prepare_pages.py --check
